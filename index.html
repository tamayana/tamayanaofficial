<script>
const start = new Date(2022,11,27,15,0,0);
function update(){
  const now = new Date();
  const diff = now - start;
  const days = Math.floor(diff/86400000);
  const hours = Math.floor(diff/3600000);
  let y = now.getFullYear()-start.getFullYear();
  let mo = now.getMonth()-start.getMonth();
  let d = now.getDate()-start.getDate();
  if(d<0){mo--; let p=new Date(now.getFullYear(),now.getMonth(),0).getDate(); d+=p;}
  if(mo<0){y--; mo+=12;}
  document.getElementById('ymd').innerHTML=`<b>${y}</b> th <b>${mo}</b> bln <b>${d}</b> hari`;
  document.getElementById('totalJam').innerHTML=`<span>${days} Hari</span> = <span>${hours.toLocaleString('id-ID')} Jam</span><br><span style="font-size:12px">${Math.floor(diff/60000).toLocaleString('id-ID')} Menit • ${Math.floor(diff/1000).toLocaleString('id-ID')} Detik</span>`;
  
  // JAM SEKARANG WIB KALBAR
  const jamNow = now.toLocaleTimeString('id-ID', {timeZone: 'Asia/Pontianak', hour12: false});
  document.getElementById('jamSekarang').innerText=`Jam sekarang ${jamNow} WIB Kalbar • live`;
}
update(); setInterval(update,1000);

const bgm = document.getElementById('bgm');
const btn = document.getElementById('musicBtn');
bgm.volume = 0.6;
setTimeout(()=>{
  bgm.muted = false;
  bgm.play().then(()=>{btn.style.display='none';}).catch(()=>{btn.innerText='🔊 Tap untuk lanjutkan musik';});
}, 5000);
btn.addEventListener('click', ()=>{bgm.muted=false;bgm.play();btn.style.display='none';});
</script>
